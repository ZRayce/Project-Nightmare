name: Build Windows Standalone EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller

      - name: Generate ICO & Build SystemVerify.exe
        run: |
          python Python-Version/make_icon.py
          pyinstaller --noconfirm --onefile --windowed --name "SystemVerify" --icon "assets/kurumi.ico" --add-data "assets/tokisaki-kurumi.gif;assets" Python-Version/kurumi_sim.py

      - name: Upload EXE as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemVerify-Windows-x64
          path: dist/SystemVerify.exe

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SystemVerify.exe